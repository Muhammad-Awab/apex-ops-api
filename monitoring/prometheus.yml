global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

# Alertmanager is part of the proposal (docs/OBSERVABILITY.md) and is not deployed locally.
# Alerts can be seen firing at http://localhost:9090/alerts

scrape_configs:
  - job_name: apex-ops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
