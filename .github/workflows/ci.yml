name: CI/CD

# Commit -> lint/test/audit -> build -> scan -> integration (deploy + smoke + rollback drill) -> publish
# Every job depends on the previous one (`needs`). A failing check skips everything after it,
# so a broken commit can never be published.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      demo_intentional_failure:
        description: "Enable the intentionally failing test (proves a red test blocks the release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests, dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Unit tests + coverage gate (>=80%)
        env:
          RUN_INTENTIONAL_FAILURE: ${{ inputs.demo_intentional_failure && '1' || '0' }}
        run: pytest --cov=app --cov-report=term --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit --strict --progress-spinner off -r requirements.txt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/

  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < Dockerfile

  build-scan-integration:
    name: Build, scan, integration & rollback test
    needs: [test, dockerfile-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"
          else VERSION="0.0.0-sha.${GITHUB_SHA::7}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build versioned runtime image
        run: bash scripts/build.sh "$VERSION"

      - name: Verify image runs as non-root
        run: test "$(docker image inspect -f '{{.Config.User}}' "apex-ops-api:$VERSION")" = "10001:10001"

      - name: Scan image for HIGH/CRITICAL vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "apex-ops-api:$VERSION"

      - name: Validate compose file and alert rules
        run: |
          APP_VERSION="$VERSION" docker compose --env-file .env.example config -q
          docker run --rm -i --entrypoint sh prom/prometheus:v2.55.1 \
            -c 'cat > /tmp/r.yml && promtool check rules /tmp/r.yml' < monitoring/alert_rules.yml

      - name: Integration - deploy with Docker Compose + smoke tests
        run: |
          bash scripts/init_secrets.sh
          bash scripts/deploy.sh "$VERSION"

      - name: Integration - broken release must be rejected and auto-rolled back
        run: |
          BAD="0.0.0-bad.${GITHUB_RUN_NUMBER}"
          bash scripts/build.sh "$BAD" --fault not_ready
          if READY_TIMEOUT=20 bash scripts/deploy.sh "$BAD"; then
            echo "::error::broken release was not rejected"; exit 1
          fi
          curl -fsS http://127.0.0.1:8080/version | grep -q "\"version\":\"$VERSION\""
          echo "auto-rollback restored $VERSION"
          cat .deploy/history.log

      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

      - name: Export tested image (promoted as-is, never rebuilt)
        if: github.event_name == 'push'
        run: docker save "apex-ops-api:$VERSION" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: image
          path: image.tar.gz
          retention-days: 3

  release:
    name: Publish versioned image to GHCR
    needs: build-scan-integration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release   # add required reviewers in repo settings for a manual approval gate
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.build-scan-integration.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load tested image
        run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push (immutable version tags, no `latest`)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apex-ops-api"
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists - versions are immutable"; exit 1
          fi
          for tag in "$VERSION" "sha-${GITHUB_SHA::7}"; do
            docker tag "apex-ops-api:$VERSION" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "### Published \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: \`APP_IMAGE=$IMAGE scripts/deploy.sh $VERSION\`" >> "$GITHUB_STEP_SUMMARY"
